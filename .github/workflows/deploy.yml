# Continuous integration + deployment.
#   - every push and pull request to main: install, run the tests, build the web app
#   - every push to main (or the "Run workflow" button): once the tests pass, deploy to the server over SSH
# The server side is prepared once with deploy/setup-cicd.sh. See docs/DEPLOYMENT.md > Automatic deployment.
# Until the DEPLOY_* secrets exist, the deploy job just says so and is skipped.
name: CI/CD

on:
  push:
    branches: [main, 'feature/**'] # feature branches run the tests only; just main deploys
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false # never cancel a deploy that is already running

jobs:
  test:
    name: Test and build
    # Pinned: "ubuntu-latest" is moving to Ubuntu 26, for which MongoDB (used by the integration tests) has no binaries yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The integration tests run the real app against a throwaway MongoDB; this fixes which one and caches the download.
      MONGOMS_VERSION: 7.0.14
      MONGOMS_DISTRO: ubuntu-22.04
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - name: Cache the test database binary
        uses: actions/cache@v4
        with:
          path: .mongodb-binaries
          key: mongod-7.0.14-ubuntu-22.04
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --include=dev
      - name: Test (unit, property-based and database integration tests)
        run: npm test
      - name: Build the web app
        run: npm run build

  deploy:
    name: Deploy to the server
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check deploy settings
        id: cfg
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          # DEPLOY_HOST_KEY is optional: without a usable one the fingerprint stored in the deploy step is trusted.
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy skipped - add the secrets DEPLOY_HOST and DEPLOY_SSH_KEY (DEPLOY_HOST_KEY is optional); see docs/DEPLOYMENT.md > Automatic deployment."
          fi

      - name: Deploy over SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          # Public fingerprint of the server's ED25519 host key (the one `ssh` showed at the first login). Only used when the
          # DEPLOY_HOST_KEY secret is missing or unusable; replace it if the server is ever reinstalled.
          DEFAULT_HOST_FINGERPRINT: SHA256:s6ky7Iqys9BZapHERiBpV3L6Fci0zOpIDKSCzuK/ioY
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh

          # Values pasted into GitHub's web form often carry a stray newline or space: clean them up first.
          host="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          port="$(printf '%s' "${DEPLOY_PORT:-22}" | tr -d '[:space:]')"; port="${port:-22}"
          if [ -z "$host" ]; then
            echo "::error::DEPLOY_HOST must be the address of your server (for example its IP address)."
            exit 1
          fi

          # Which server identity do we trust? The server must PROVE it by presenting exactly this key, so a wrong value can
          # only ever make the deploy fail; it can never send the key or the commands to another machine.
          #   1) DEPLOY_HOST_KEY (secret): "ssh-ed25519 AAAA..." (what deploy/setup-cicd.sh prints) or a "SHA256:..." fingerprint
          #   2) otherwise the fingerprint stored in this workflow (DEFAULT_HOST_FINGERPRINT)
          # The server is accepted if it presents EITHER of these two keys (a typo in one cannot lock the pipeline out).
          secret_fp=""
          hostkey="$(printf '%s' "$DEPLOY_HOST_KEY" | tr -s '[:space:]' ' ' | awk '{ for (i = 1; i <= NF; i++) if ($i ~ /^(ssh|ecdsa)-/) { print $i, $(i + 1); exit } }')"
          if [ "$(printf '%s' "$hostkey" | wc -w)" = 2 ]; then
            printf '%s\n' "$hostkey" > "$HOME/pin.pub"
            secret_fp="$(ssh-keygen -l -f "$HOME/pin.pub" 2> /dev/null | awk '{ print $2 }')" || true
          fi
          if [ -z "$secret_fp" ]; then
            secret_fp="$(printf '%s' "$DEPLOY_HOST_KEY" | grep -oE 'SHA256:[A-Za-z0-9+/]{43}' | head -n1 || true)"
          fi
          trusted="$DEFAULT_HOST_FINGERPRINT"
          if [ -n "$secret_fp" ]; then trusted="$secret_fp $trusted"; fi
          if [ -z "$secret_fp" ]; then
            echo "::warning title=DEPLOY_HOST_KEY is not a usable host key::It has ${#DEPLOY_HOST_KEY} characters and is not a valid 'ssh-ed25519 AAAA...' line or SHA256 fingerprint, so only the fingerprint stored in the workflow is trusted. Re-save the secret from /etc/ssh/ssh_host_ed25519_key.pub on the server, or ignore this notice."
          fi

          # Rebuild the private key in the exact layout OpenSSH wants. Pasting into a web form can flatten the line breaks, add
          # spaces or indentation, change the dashes, or leave out the BEGIN/END lines; none of that matters for the base64 payload.
          raw="$(printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r' | tr '\n' ' ')"
          lines="$(printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r' | grep -c . || true)"
          has_begin=no; has_end=no
          case "$raw" in *"BEGIN OPENSSH PRIVATE KEY"*) has_begin=yes ;; esac
          case "$raw" in *"END OPENSSH PRIVATE KEY"*) has_end=yes ;; esac
          payload="$raw"
          if [ "$has_begin" = yes ]; then payload="${payload#*BEGIN OPENSSH PRIVATE KEY}"; fi
          if [ "$has_end" = yes ]; then payload="${payload%%END OPENSSH PRIVATE KEY*}"; fi
          payload="${payload//OPENSSH PRIVATE KEY/}"
          payload="$(printf '%s' "$payload" | tr -cd 'A-Za-z0-9+/=')"
          {
            echo '-----BEGIN OPENSSH PRIVATE KEY-----'
            printf '%s' "$payload" | fold -w 70
            echo
            echo '-----END OPENSSH PRIVATE KEY-----'
          } > ~/.ssh/deploy_key
          detail="${#payload} characters of key data in $lines lines; BEGIN line: $has_begin, END line: $has_end"
          echo "DEPLOY_SSH_KEY: $detail (a complete key from deploy/setup-cicd.sh has 336 characters in 6 lines)"
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY is not a usable private key: $detail. Expected 336 characters, BEGIN line: yes, END line: yes. Copy the whole block again, from -----BEGIN to -----END, without retyping it."
            exit 1
          fi

          # Fetch the server's real host keys and keep only the one whose fingerprint is the trusted one. ssh then connects
          # with strict checking against exactly that key, so the key and the commands can only ever go to YOUR server.
          ssh-keyscan -T 10 -p "$port" "$host" > "$HOME/scanned_hosts" 2> /dev/null || true
          if [ ! -s "$HOME/scanned_hosts" ]; then
            echo "::error::The server did not give out an SSH host key on port $port. Check DEPLOY_HOST (the server's address), that SSH is reachable from the internet (hosting firewall), and DEPLOY_PORT if SSH is not on port 22."
            exit 1
          fi
          : > ~/.ssh/known_hosts
          seen=""
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            printf '%s\n' "$line" > "$HOME/one_host_key"
            fp="$(ssh-keygen -l -f "$HOME/one_host_key" 2> /dev/null | awk '{ print $2 }')" || true
            seen="$seen $fp"
            if [ -n "$fp" ]; then
              case " $trusted " in *" $fp "*) printf '%s\n' "$line" >> ~/.ssh/known_hosts ;; esac
            fi
          done < "$HOME/scanned_hosts"

          # Fingerprints are public information; they make any mismatch easy to read.
          # On the server:  ssh-keygen -l -f /etc/ssh/ssh_host_ed25519_key.pub     and     ssh-keygen -l -f /root/.ssh/authorized_keys
          deploy_fp="$(ssh-keygen -l -f ~/.ssh/deploy_key | cut -d' ' -f2)"
          echo "SSH port $port; trusted server keys      : $trusted"
          echo "Server presents                       :$seen"
          echo "Deploy key offered                    : $deploy_fp"
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error title=The server's SSH host key does not match::Trusted: $trusted. The server presents:$seen. If the server was reinstalled, update DEPLOY_HOST_KEY (and DEFAULT_HOST_FINGERPRINT in the workflow) from /etc/ssh/ssh_host_ed25519_key.pub; otherwise DEPLOY_HOST points at the wrong machine."
            exit 1
          fi
          if [ -n "$secret_fp" ]; then
            case "$seen" in *" $secret_fp"*) ;; *) echo "::warning title=DEPLOY_HOST_KEY does not match the server::The server was accepted through the fingerprint stored in the workflow. The DEPLOY_HOST_KEY secret probably has a typo; you can ignore this or re-save it." ;; esac
          fi

          # The server-side key is restricted to one command (deploy/setup-cicd.sh), so the word after the host is only a label.
          # Keep a copy of what the server says, and put the reason in the run summary when it fails.
          set +e
          ssh -i ~/.ssh/deploy_key -p "$port" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "root@${host}" deploy 2>&1 | tee "$HOME/deploy.log"
          rc="${PIPESTATUS[0]}"
          set -e
          if [ "$rc" -ne 0 ]; then
            reason="$(tail -n 5 "$HOME/deploy.log" | tr -d '\r' | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }')"
            echo "::error title=Deploy failed (exit $rc)::$reason"
            exit "$rc"
          fi

      - name: Smoke test the public site
        if: steps.cfg.outputs.ready == 'true' && vars.SITE_URL != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "${SITE_URL%/}/api/health" | grep -q '"database":"connected"'; then
              echo "${SITE_URL%/} is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "::error::${SITE_URL%/}/api/health did not report a connected database."
          exit 1

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
