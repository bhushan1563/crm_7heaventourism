# Continuous integration + deployment.
#   - every push and pull request to main: install, run the tests, build the web app
#   - every push to main (or the "Run workflow" button): once the tests pass, deploy to the server over SSH
# The server side is prepared once with deploy/setup-cicd.sh. See docs/DEPLOYMENT.md > Automatic deployment.
# Until the DEPLOY_* secrets exist, the deploy job just says so and is skipped.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false # never cancel a deploy that is already running

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --include=dev
      - name: Test (needs no database)
        run: npm test
      - name: Build the web app
        run: npm run build

  deploy:
    name: Deploy to the server
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check deploy settings
        id: cfg
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_HOST_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy skipped - add the secrets DEPLOY_HOST, DEPLOY_HOST_KEY and DEPLOY_SSH_KEY (see docs/DEPLOYMENT.md > Automatic deployment)."
          fi

      - name: Deploy over SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh

          # Values pasted into GitHub's web form often carry a stray newline or space: clean them up first.
          host="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          port="$(printf '%s' "${DEPLOY_PORT:-22}" | tr -d '[:space:]')"; port="${port:-22}"
          # Accept "ssh-ed25519 AAAA...", with or without a host name in front of it.
          hostkey="$(printf '%s' "$DEPLOY_HOST_KEY" | tr -s '[:space:]' ' ' | awk '{ for (i = 1; i <= NF; i++) if ($i ~ /^(ssh|ecdsa)-/) { print $i, $(i + 1); exit } }')"
          if [ -z "$host" ] || [ "$(printf '%s' "$hostkey" | wc -w)" != 2 ]; then
            echo "::error::DEPLOY_HOST must be the server address, and DEPLOY_HOST_KEY must look like: ssh-ed25519 AAAAC3Nza..."
            exit 1
          fi

          # Rebuild the private key in the exact layout OpenSSH wants. Pasting into a web form can flatten the line breaks, add
          # spaces or indentation, or turn the dashes into other characters; none of that matters for the base64 payload itself.
          raw="$(printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r' | tr '\n' ' ')"
          case "$raw" in
            *"BEGIN OPENSSH PRIVATE KEY"*"END OPENSSH PRIVATE KEY"*) ;;
            *) echo "::error::DEPLOY_SSH_KEY must contain the lines -----BEGIN OPENSSH PRIVATE KEY----- ... -----END OPENSSH PRIVATE KEY-----. Paste the whole block."; exit 1 ;;
          esac
          payload="${raw#*BEGIN OPENSSH PRIVATE KEY}"
          payload="${payload%%END OPENSSH PRIVATE KEY*}"
          payload="$(printf '%s' "$payload" | tr -cd 'A-Za-z0-9+/=')"
          {
            echo '-----BEGIN OPENSSH PRIVATE KEY-----'
            printf '%s' "$payload" | fold -w 70
            echo
            echo '-----END OPENSSH PRIVATE KEY-----'
          } > ~/.ssh/deploy_key
          echo "DEPLOY_SSH_KEY: ${#payload} characters of key data found (a complete key made by deploy/setup-cicd.sh has 336)"
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY has ${#payload} characters of key data but should have 336, or a character is wrong. Copy the key again, from -----BEGIN to -----END, without retyping it."
            exit 1
          fi

          # known_hosts pins the server's own host key, so the key and the commands can only ever go to YOUR server.
          if [ "$port" = "22" ]; then host_entry="$host"; else host_entry="[$host]:$port"; fi
          printf '%s %s\n' "$host_entry" "$hostkey" > ~/.ssh/known_hosts

          # Fingerprints are public information; showing them makes a mismatch easy to spot against the server
          # (on the server:  ssh-keygen -l -f /etc/ssh/ssh_host_ed25519_key.pub   and   ssh-keygen -l -f /root/.ssh/authorized_keys).
          echo "SSH port $port; trusted server key       : $(ssh-keygen -l -f ~/.ssh/known_hosts | cut -d' ' -f2)"
          echo "Deploy key offered                    : $(ssh-keygen -l -f ~/.ssh/deploy_key | cut -d' ' -f2)"

          # The server-side key is restricted to one command (deploy/setup-cicd.sh), so the word after the host is only a label.
          ssh -i ~/.ssh/deploy_key -p "$port" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "root@${host}" deploy

      - name: Smoke test the public site
        if: steps.cfg.outputs.ready == 'true' && vars.SITE_URL != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "${SITE_URL%/}/api/health" | grep -q '"database":"connected"'; then
              echo "${SITE_URL%/} is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "::error::${SITE_URL%/}/api/health did not report a connected database."
          exit 1

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
