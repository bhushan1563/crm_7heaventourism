# Shared by every location in 7heaven-crm.conf. Installed to /etc/nginx/snippets/7heaven-proxy.conf by deploy/setup-vps.sh.
# The upstream address is substituted from PORT in backend/.env (default 5000).
proxy_pass http://127.0.0.1:5000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;   # business-card OCR can take a while
proxy_send_timeout 120s;
