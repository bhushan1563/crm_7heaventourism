# /etc/nginx/sites-available/7heaven-crm   (symlinked into sites-enabled by deploy/setup-vps.sh)
# Nginx terminates HTTP(S) and forwards everything to the single Node process, which serves both the API and the web app.
# Manual install:  see docs/DEPLOYMENT.md (copy 7heaven-proxy.conf to /etc/nginx/snippets/ first).
# HTTPS: `sudo certbot --nginx -d crm.example.com` adds the 443 server block and the HTTP -> HTTPS redirect for you.

# Edge rate limit for sign-in attempts, on top of the app's own limiter (defence in depth against password guessing).
limit_req_zone $binary_remote_addr zone=crm_login:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name crm.example.com;

    server_tokens off;

    # Largest accepted request: the scanner takes images up to 10 MB (15 MB when sent as base64 JSON); everything else is < 5 MB.
    client_max_body_size 16m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Sign-in: at most ~12 attempts a minute per IP (bursts of 6 tolerated), then HTTP 429.
    location = /api/auth/login {
        limit_req zone=crm_login burst=6 nodelay;
        limit_req_status 429;
        include snippets/7heaven-proxy.conf;
    }

    # Health checks are noisy; keep them out of the access log.
    location = /api/health {
        access_log off;
        include snippets/7heaven-proxy.conf;
    }

    location / {
        include snippets/7heaven-proxy.conf;
    }
}
