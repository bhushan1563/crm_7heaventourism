# /etc/nginx/sites-available/7heaven-crm   (symlink into sites-enabled, then: nginx -t && systemctl reload nginx)
# Nginx only terminates HTTP(S) and forwards everything to the single Node process, which serves both the API and the web app.
# Replace crm.example.com, then run:  sudo certbot --nginx -d crm.example.com   (adds the HTTPS server block + redirect)
#
# After HTTPS works, add this inside the 443 server block so browsers never fall back to plain HTTP:
#     add_header Strict-Transport-Security "max-age=31536000" always;
# (The Node app already sends the other security headers: CSP, X-Content-Type-Options, Permissions-Policy, ...)

server {
    listen 80;
    listen [::]:80;
    server_name crm.example.com;

    server_tokens off;

    # Largest accepted request: the scanner takes images up to 10 MB (15 MB when sent as base64 JSON); everything else is < 5 MB.
    client_max_body_size 16m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:5000;   # keep in sync with PORT in backend/.env
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;            # business-card OCR can take a while
        proxy_send_timeout 120s;
    }
}
